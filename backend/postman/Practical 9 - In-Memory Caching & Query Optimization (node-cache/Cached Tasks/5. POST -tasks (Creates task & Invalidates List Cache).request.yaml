$kind: http-request
name: 5. POST /tasks (Creates task & Invalidates List Cache)
url: "{{base_url}}/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "title": "Implement Caching in Production",
        "description": "Using node-cache for high-throughput reads",
        "completed": false
    }
auth:
  type: bearer
  credentials:
    token: "{{jwt_token}}"
scripts:
  - type: afterResponse
    code: |-
      const jsonData = pm.response.json();
      if (jsonData.task && jsonData.task._id) {
          pm.collectionVariables.set('task_id', jsonData.task._id);
      }
    language: text/javascript
order: 3000
