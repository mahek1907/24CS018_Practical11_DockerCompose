$kind: http-request
description: Updates a task owned by the user.
url: "{{base_url}}/tasks/{{task_id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "title": "Practical 7 Verified and Complete",
        "completed": true
    }
auth:
  type: bearer
  credentials:
    token: "{{jwt_token}}"
order: 3000
